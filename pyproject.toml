[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kim-forger-snf-period-homeostasis"
version = "0.2.0"
description = "Reproducibility code for period homeostasis computations in the Kim-Forger SNF model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "jupyter>=1.0",
]

